<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="static/img/favicon-logo.png" type="image/x-icon">
    <title>Login | Training Schedule</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .logo { width: 250px; margin-bottom: 1rem; }

        h1 { margin-bottom: 1.5rem; }

        .divider {
            height: 4px;
            width: 60px;
            background-color: #2ecc71;
            margin: 0 auto 2rem;
            border-radius: 2px;
        }

        .input-group { margin-bottom: 1rem; text-align: left; }

        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background-color: #2ecc71;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        .link {
            margin-top: 15px;
            display: block;
            font-size: 0.9rem;
        }

        .error { color: red; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <img src="static/img/logo1.png" class="logo">

    <h1>Login</h1>
    <div class="divider"></div>

    <form id="loginForm">
        <div class="input-group">
            <input type="text" id="username" placeholder="Usuário" required>
        </div>

        <div class="input-group">
            <input type="password" id="password" placeholder="Senha" required>
        </div>

        <button class="btn">Entrar</button>

        <p class="error" id="errorMsg"></p>
    </form>

    <a href="register.html" class="link">Cadastrar novo usuário</a>
</div>

<script>
const form = document.getElementById("loginForm")
const errorMsg = document.getElementById("errorMsg")

form.addEventListener("submit", async function(e) {
    e.preventDefault()

    const login = document.getElementById("username").value
    const senha = document.getElementById("password").value

    const response = await fetch("http://trainingscheduleback-production.up.railway.app/auth/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ login, senha })
    })

    const data = await response.json()

    if (!response.ok) {
        errorMsg.textContent = data.error
        return
    }

    localStorage.setItem("token", data.token)
    localStorage.setItem("user", JSON.stringify(data.user))

    window.location.href = "index.html"
})

if (localStorage.getItem("token")) {
    window.location.href = "index.html"
}
</script>

</body>
</html>

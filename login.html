<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="static/img/favicon-logo.png" type="image/x-icon">
    <title>Login | Training Schedule</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary d-flex align-items-center justify-content-center vh-100">

<div class="container" style="max-width: 400px;">
    <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 text-center bg-white">
        <img src="static/img/logo1.png" class="img-fluid mb-3 mx-auto" style="max-width: 250px;" alt="Logo">
        
        <h3 class="fw-bold text-dark mb-2">Login</h3>
        <div class="mx-auto bg-success rounded-pill mb-4" style="height: 4px; width: 60px;"></div>

        <form id="loginForm">
            <div class="form-floating mb-3 text-start">
                <input type="text" class="form-control rounded-3" id="username" placeholder="Usuário" required>
                <label for="username" class="text-secondary">Usuário</label>
            </div>

            <div class="form-floating mb-4 text-start">
                <input type="password" class="form-control rounded-3" id="password" placeholder="Senha" required>
                <label for="password" class="text-secondary">Senha</label>
            </div>

            <button class="btn btn-success w-100 py-2 rounded-3 fw-bold shadow-sm" style="transition: all 0.3s;" type="submit">Entrar</button>

            <p class="text-danger mt-3 mb-0 fw-medium" id="errorMsg"></p>
        </form>

        <div class="mt-4 pt-2 border-top">
            <a href="register.html" class="text-decoration-none text-secondary">Não tem uma conta? <strong>Cadastre-se</strong></a>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
const form = document.getElementById("loginForm")
const errorMsg = document.getElementById("errorMsg")

form.addEventListener("submit", async function(e) {
    e.preventDefault()

    const login = document.getElementById("username").value
    const senha = document.getElementById("password").value

    const response = await fetch("https://trainingscheduleback-production-2a22.up.railway.app/auth/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ login, senha })
    })

    const data = await response.json()

    if (!response.ok) {
        errorMsg.textContent = data.error
        return
    }

    localStorage.setItem("token", data.token)
    localStorage.setItem("user", JSON.stringify(data.user))

    window.location.href = "index.html"
})

if (localStorage.getItem("token")) {
    window.location.href = "index.html"
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="static/img/favicon-logo.png" type="image/x-icon">
    <title>Login | Training Schedule</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .logo {
            width: 250px;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 1.5rem;
        }

        .divider {
            height: 4px;
            width: 60px;
            background-color: #2ecc71;
            margin: 0 auto 2rem;
            border-radius: 2px;
        }

        .input-group {
            margin-bottom: 1rem;
            text-align: left;
        }

        .input-group label {
            font-size: 0.9rem;
            display: block;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background-color: #2ecc71;
            border: none;
            color: white;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #27ae60;
        }

        .error {
            color: red;
            margin-top: 10px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="static/img/logo1.png" alt="Logo do site" class="logo">

        <h1>Login</h1>

        <div class="divider"></div>

        <form id="loginForm">
            <div class="input-group">
                <label>Usuário</label>
                <input type="text" id="username" required>
            </div>

            <div class="input-group">
                <label>Senha</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit" class="btn">Entrar</button>

            <p class="error" id="errorMsg"></p>
        </form>
    </div>

    <script>
        const form = document.getElementById("loginForm");
        const errorMsg = document.getElementById("errorMsg");

        form.addEventListener("submit", function(e) {
            e.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            // 🔥 Login fake (pode alterar depois)
            if (username === "admin" && password === "123") {
                
                // salva na sessão
                sessionStorage.setItem("user", username);

                // redireciona
                window.location.href = "index.html";
            } else {
                errorMsg.textContent = "Usuário ou senha inválidos!";
            }
        });

        // 🔥 Se já estiver logado, pula login
        if (sessionStorage.getItem("user")) {
            window.location.href = "index.html";
        }
    </script>

</body>
</html>

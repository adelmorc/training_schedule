<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="static/img/favicon-logo.png" type="image/x-icon">
    <title>Incluir Usuário | Training Schedule</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
        }
        .main-container {
            margin-top: 30px;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 600px;
        }
    </style>
</head>
<body>

    <!-- Navbar Bootstrap 5 -->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #2c3e50; padding: 10px 20px;">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html">Training Schedule</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle active" href="#" id="navbarDropdownCadastros" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Cadastros
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdownCadastros">
                            <li><a class="dropdown-item" href="list_users.html">Usuários</a></li>
                        </ul>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3 text-white">
                    <span id="userName" class="fw-semibold"></span>
                    <button class="btn btn-danger btn-sm" onclick="logout()">Sair</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container main-container mx-auto">
        <h2 class="mb-4">Incluir Novo Usuário</h2>
        
        <form id="createUserForm">
            <div class="mb-3">
                <label for="nome" class="form-label">Nome Completo</label>
                <input type="text" class="form-control" id="nome" required>
            </div>
            
            <div class="mb-3">
                <label for="login" class="form-label">Login</label>
                <input type="text" class="form-control" id="login" required>
            </div>
            
            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" required>
            </div>
            
            <div class="d-flex justify-content-between mt-4">
                <a href="list_users.html" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-success">Salvar Usuário</button>
            </div>
        </form>

        <div id="msgBox" class="mt-3 alert d-none" role="alert"></div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        async function checkAuth() {
            const token = localStorage.getItem("token");
            if (!token) {
                window.location.href = "login.html";
                return;
            }

            try {
                const response = await fetch("https://trainingscheduleback-production-2a22.up.railway.app/auth/me", {
                    headers: { "Authorization": "Bearer " + token }
                });

                if (!response.ok) throw new Error();

                const data = await response.json();
                document.getElementById("userName").textContent = "👤 " + data.user.login;

            } catch (error) {
                logout();
            }
        }

        function logout() {
            localStorage.removeItem("token");
            sessionStorage.removeItem("user");
            window.location.href = "login.html";
        }

        document.getElementById("createUserForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            
            const nome = document.getElementById("nome").value;
            const login = document.getElementById("login").value;
            const senha = document.getElementById("senha").value;
            const msgBox = document.getElementById("msgBox");
            
            // Reutilizando a rota de registro que já existe no seu sistema
            try {
                const response = await fetch("https://trainingscheduleback-production-2a22.up.railway.app/auth/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ nome, login, senha })
                });

                const data = await response.json();

                if (!response.ok) {
                    msgBox.className = "mt-3 alert alert-danger";
                    msgBox.textContent = data.error || "Erro ao cadastrar usuário.";
                    return;
                }

                msgBox.className = "mt-3 alert alert-success";
                msgBox.textContent = "Usuário incluído com sucesso! Redirecionando...";
                
                setTimeout(() => {
                    window.location.href = "list_users.html";
                }, 1500);
                
            } catch (error) {
                msgBox.className = "mt-3 alert alert-danger";
                msgBox.textContent = "Erro na conexão com a API.";
            }
        });

        checkAuth();
    </script>
</body>
</html>

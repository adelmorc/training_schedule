<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="static/img/favicon-logo.png" type="image/x-icon">
    <title>Cadastrar | Training Schedule</title>

    <!-- Dark Mode Script (Prevent Flash) -->
    <script>
        const getPreferredTheme = () => localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', getPreferredTheme());
    </script>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary d-flex align-items-center justify-content-center vh-100 position-relative">

<!-- Theme Toggle Button -->
<button class="btn btn-secondary rounded-circle position-fixed top-0 end-0 m-3 shadow-sm d-flex align-items-center justify-content-center" style="width: 45px; height: 45px; z-index: 1000;" id="themeToggleBtn" title="Alternar Tema">
    <span id="themeIcon" style="font-size: 1.2rem;">🌓</span>
</button>

<div class="container" style="max-width: 400px;">
    <!-- Removido bg-white e text-dark -->
    <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 text-center bg-body">
        <img src="static/img/logo1.png" class="img-fluid mb-3 mx-auto" style="max-width: 250px;" alt="Logo">
        
        <h3 class="fw-bold mb-2">Criar Conta</h3>
        <div class="mx-auto bg-success rounded-pill mb-4" style="height: 4px; width: 60px;"></div>

        <form id="registerForm">
            <div class="form-floating mb-3 text-start">
                <input type="text" class="form-control rounded-3" id="nome" placeholder="Nome" required>
                <label for="nome" class="text-body-secondary">Nome Completo</label>
            </div>

            <div class="form-floating mb-3 text-start">
                <input type="text" class="form-control rounded-3" id="login" placeholder="Login" required>
                <label for="login" class="text-body-secondary">Nome de Usuário</label>
            </div>

            <div class="form-floating mb-4 text-start">
                <input type="password" class="form-control rounded-3" id="senha" placeholder="Senha" required>
                <label for="senha" class="text-body-secondary">Senha</label>
            </div>

            <button class="btn btn-success w-100 py-2 rounded-3 fw-bold shadow-sm" style="transition: all 0.3s;" type="submit">Cadastrar</button>

            <p class="mt-3 mb-0 fw-medium" id="msg"></p>
        </form>

        <div class="mt-4 pt-2 border-top">
            <a href="login.html" class="text-decoration-none text-body-secondary">Já tem uma conta? <strong class="text-body">Faça Login</strong></a>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Dark Mode Toggle Script -->
<script>
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');
    
    const updateThemeIcon = (theme) => {
        themeIcon.textContent = theme === 'dark' ? '☀️' : '🌙';
    };

    updateThemeIcon(document.documentElement.getAttribute('data-bs-theme'));

    if(themeToggleBtn) {
        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-bs-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });
    }
</script>

<script>
const form = document.getElementById("registerForm")
const msg = document.getElementById("msg")

form.addEventListener("submit", async function(e) {
    e.preventDefault()

    const nome = document.getElementById("nome").value
    const login = document.getElementById("login").value
    const senha = document.getElementById("senha").value

    const response = await fetch("https://training-schedule-back.onrender.com/auth/register", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ nome, login, senha })
    })

    const data = await response.json()

    if (!response.ok) {
        msg.className = "text-danger mt-3 mb-0 fw-medium"
        msg.textContent = data.error
        return
    }

    msg.className = "text-success mt-3 mb-0 fw-medium"
    msg.textContent = "Usuário criado com sucesso!"

    setTimeout(() => {
        window.location.href = "login.html"
    }, 1500)
})
</script>

</body>
</html>

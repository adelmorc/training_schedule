<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="static/img/favicon-logo.png" type="image/x-icon">
    <title>
        Training Schedule | Em Desenvolvimento
    </title>
    <style>        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
        }

        .navbar {
            width: 100%;
            background-color: #2c3e50;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-left {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logout-btn {
            padding: 5px 10px;
            border: none;
            background-color: #e74c3c;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .logout-btn:hover {
            background-color: #c0392b;
        }

        .main {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 60px);
        }

        .container {
            background-color: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .logo {
            width: 300px;
            height: auto;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2rem;
            color: #2c3e50;
            margin-bottom: 1.5rem;
        }

        .divider {
            height: 4px;
            width: 60px;
            background-color: #2ecc71;
            margin: 0 auto;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-left">Training Schedule</div>
        <div class="nav-right">
            <span id="userName"></span>
            <button class="logout-btn" onclick="logout()">Sair</button>
        </div>
    </div>

    <div class="main">
        <div class="container">
            <img src="static/img/logo1.png" alt="Logo do site" class="logo">
            <h1>Em desenvolvimento...</h1>
            <div class="divider"></div>
        </div>
    </div>

    <script>
        async function checkAuth() {
            const token = localStorage.getItem("token")

            if (!token) {
                window.location.href = "login.html"
                return
            }

            try {
                const response = await fetch("https://trainingscheduleback-production-2a22.up.railway.app/auth/me", {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                })

                if (!response.ok) {
                    throw new Error()
                }

                const data = await response.json()

                document.getElementById("username").textContent = "👤 " + data.user.login

            } catch (error) {
                localStorage.removeItem("token")
                sessionStorage.removeItem("user")
                window.location.href = "login.html"
            }
        }

        checkAuth()
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="static/img/favicon-logo.png" type="image/x-icon">
    <title>Training Schedule | Em Desenvolvimento</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
        }

        .logout-btn:hover {
            background-color: #c0392b;
        }

        .main {
            display: flex;
            justify-content: center;
            align-items: center;
            height: calc(100vh - 60px);
        }

        .container {
            background-color: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .logo {
            width: 300px;
            height: auto;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2rem;
            color: #2c3e50;
            margin-bottom: 1.5rem;
        }

        .divider {
            height: 4px;
            width: 60px;
            background-color: #2ecc71;
            margin: 0 auto;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <!-- Navbar Bootstrap 5 -->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #2c3e50; padding: 10px 20px;">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html">Training Schedule</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdownCadastros" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Cadastros
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdownCadastros">
                            <li><a class="dropdown-item" href="list_users.html">Usuários</a></li>
                        </ul>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3 text-white">
                    <span id="userName" class="fw-semibold"></span>
                    <button class="btn btn-danger btn-sm" onclick="logout()">Sair</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="main">
        <div class="container">
            <img src="static/img/logo1.png" alt="Logo do site" class="logo">
            <h1>Em desenvolvimento...</h1>
            <div class="divider"></div>
        </div>
    </div>

    <script>
        async function checkAuth() {
            const token = localStorage.getItem("token")

            if (!token) {
                window.location.href = "login.html"
                return
            }

            try {
                const response = await fetch("https://trainingscheduleback-production-2a22.up.railway.app/auth/me", {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                })

                if (!response.ok) {
                    throw new Error()
                }

                const data = await response.json()

                document.getElementById("userName").textContent = "👤 " + data.user.login

            } catch (error) {
                localStorage.removeItem("token")
                sessionStorage.removeItem("user")
                window.location.href = "login.html"
            }
        }

        checkAuth()

        function logout() {
            localStorage.removeItem("token")
            sessionStorage.removeItem("user")
            window.location.href = "login.html"
        }
    </script>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

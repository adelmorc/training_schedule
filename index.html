<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="static/img/favicon-logo.png" type="image/x-icon">
    <title>
        Training Schedule | Em Desenvolvimento
    </title>
    <style>        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; 
            text-align: center;
        }

        .container {
            background-color: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            max-width: 400px;
            width: 90%;
        }

        .logo {
            width: 300px;
            height: auto;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2rem;
            color: #2c3e50;
            margin-bottom: 1.5rem;
        }

        .divider {
            height: 4px;
            width: 60px;
            background-color: #2ecc71;
            margin: 0 auto;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="static/img/logo1.png" alt="Logo do site" class="logo">

        <h1>Em desenvolvimento...</h1>

        <div class="divider"></div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="static/img/favicon-logo.png" type="image/x-icon">
    <title>Training Schedule | Em Desenvolvimento</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

    <!-- Navbar Bootstrap 5 Elegante -->
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background: linear-gradient(135deg, #2c3e50, #34495e); padding: 12px 20px; border-bottom: 2px solid #2ecc71;">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html">
                <img src="static/img/favicon-logo.png" alt="Logo" width="30" height="30" class="d-inline-block align-text-top rounded">
                <span style="letter-spacing: 0.5px;">Training Schedule</span>
            </a>
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle px-3 text-white" href="#" id="navbarDropdownCadastros" role="button" data-bs-toggle="dropdown" aria-expanded="false" style="font-weight: 500; transition: all 0.3s;">
                            Cadastros
                        </a>
                        <ul class="dropdown-menu shadow border-0 mt-2" aria-labelledby="navbarDropdownCadastros" style="border-radius: 8px;">
                            <li><a class="dropdown-item py-2" href="list_users.html">👥 Gerenciar Usuários</a></li>
                        </ul>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-4 text-white">
                    <div class="d-flex align-items-center gap-2" style="background: rgba(255,255,255,0.1); padding: 6px 16px; border-radius: 20px; font-size: 0.95rem;">
                        <span>👤</span>
                        <span id="userName" class="fw-semibold" style="letter-spacing: 0.5px;"></span>
                    </div>
                    <button class="btn btn-outline-light btn-sm px-4 rounded-pill fw-bold" style="transition: all 0.3s;" onclick="logout()" onmouseover="this.classList.replace('btn-outline-light','btn-danger')" onmouseout="this.classList.replace('btn-danger','btn-outline-light')">Sair</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="d-flex justify-content-center align-items-center" style="height: calc(100vh - 76px);">
        <div class="container text-center">
            <div class="card shadow-sm border-0 rounded-4 p-5 d-inline-block bg-white" style="max-width: 500px; width: 100%;">
                <img src="static/img/logo1.png" alt="Logo do site" class="img-fluid mb-4 mx-auto" style="max-width: 280px;">
                <h3 class="fw-bold text-dark mb-3">Em desenvolvimento...</h3>
                <div class="mx-auto bg-success rounded-pill" style="height: 4px; width: 60px;"></div>
            </div>
        </div>
    </div>

    <script>
        async function checkAuth() {
            const token = localStorage.getItem("token")

            if (!token) {
                window.location.href = "login.html"
                return
            }

            try {
                const response = await fetch("https://trainingscheduleback-production-2a22.up.railway.app/auth/me", {
                    headers: {
                        "Authorization": "Bearer " + token
                    }
                })

                if (!response.ok) {
                    throw new Error()
                }

                const data = await response.json()

                // Atualizei a linha abaixo para não quebrar a lógica e remover o emoji hardcoded caso tenha
                document.getElementById("userName").textContent = data.user.login

            } catch (error) {
                localStorage.removeItem("token")
                sessionStorage.removeItem("user")
                window.location.href = "login.html"
            }
        }

        checkAuth()

        function logout() {
            localStorage.removeItem("token")
            sessionStorage.removeItem("user")
            window.location.href = "login.html"
        }
    </script>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

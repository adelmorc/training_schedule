<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="static/img/favicon-logo.png" type="image/x-icon">
    <title>Usuários | Training Schedule</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- DataTables Bootstrap 5 CSS -->
    <link href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <!-- DataTables Buttons CSS -->
    <link href="https://cdn.datatables.net/buttons/2.4.2/css/buttons.bootstrap5.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
        }
        .main-container {
            margin-top: 30px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- Navbar Bootstrap 5 -->
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #2c3e50; padding: 10px 20px;">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html">Training Schedule</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle active" href="#" id="navbarDropdownCadastros" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Cadastros
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdownCadastros">
                            <li><a class="dropdown-item" href="list_users.html">Usuários</a></li>
                        </ul>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3 text-white">
                    <span id="userName" class="fw-semibold"></span>
                    <button class="btn btn-danger btn-sm" onclick="logout()">Sair</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container main-container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Lista de Usuários</h2>
            <a href="create_user.html" class="btn btn-success">Incluir Usuário</a>
        </div>

        <div class="table-responsive">
            <table id="usersTable" class="table table-striped table-bordered" style="width:100%">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Login</th>
                        <th style="width: 150px;">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Os dados serão inseridos aqui via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal Confirmação de Exclusão -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteModalLabel">Confirmar Exclusão</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body">
                    Tem certeza que deseja excluir o usuário <strong id="deleteUserName"></strong>?
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Excluir</button>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- DataTables Core -->
    <script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <!-- DataTables Bootstrap 5 -->
    <script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
    <!-- DataTables Buttons -->
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.bootstrap5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.53/vfs_fonts.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.print.min.js"></script>

    <script>
        let userIdToDelete = null;
        let dataTable = null;

        // Verificar Autenticação
        async function checkAuth() {
            const token = localStorage.getItem("token");
            if (!token) {
                window.location.href = "login.html";
                return;
            }

            try {
                const response = await fetch("https://trainingscheduleback-production-2a22.up.railway.app/auth/me", {
                    headers: { "Authorization": "Bearer " + token }
                });

                if (!response.ok) throw new Error();

                const data = await response.json();
                document.getElementById("userName").textContent = "👤 " + data.user.login;

                // Após validar, busca os usuários
                fetchUsers(token);

            } catch (error) {
                logout();
            }
        }

        function logout() {
            localStorage.removeItem("token");
            sessionStorage.removeItem("user");
            window.location.href = "login.html";
        }

        // Buscar Usuários na API (Endpoint pode variar dependendo do seu backend)
        async function fetchUsers(token) {
            try {
                // ATENÇÃO: Verifique qual é a URL correta na sua API para listar usuários
                const response = await fetch("https://trainingscheduleback-production-2a22.up.railway.app/users", {
                    headers: { "Authorization": "Bearer " + token }
                });

                if (!response.ok) {
                    // Trata caso a API não tenha essa rota
                    console.error("Erro ao buscar usuários");
                    // Exemplo de dados fictícios caso a API falhe (remover depois)
                    initDataTable([
                        { id: 1, nome: "Usuário Teste", login: "teste" },
                        { id: 2, nome: "Admin", login: "admin" }
                    ]);
                    return;
                }

                const users = await response.json();
                
                // Inicializar DataTable com os dados da API
                // Caso a sua API retorne os dados dentro de uma propriedade (ex: users.data), ajuste aqui.
                initDataTable(users);

            } catch (error) {
                console.error("Erro na requisição:", error);
            }
        }

        function initDataTable(data) {
            if (dataTable) {
                dataTable.destroy();
            }

            const tbody = document.querySelector("#usersTable tbody");
            tbody.innerHTML = "";

            data.forEach(user => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${user.id || '-'}</td>
                    <td>${user.nome || '-'}</td>
                    <td>${user.login || '-'}</td>
                    <td>
                        <a href="edit_user.html?id=${user.id}" class="btn btn-primary btn-sm">Editar</a>
                        <button class="btn btn-danger btn-sm" onclick="openDeleteModal(${user.id}, '${user.nome}')">Excluir</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            dataTable = $('#usersTable').DataTable({
                language: {
                    url: 'https://cdn.datatables.net/plug-ins/1.13.7/i18n/pt-BR.json'
                },
                dom: 'Bfrtip',
                buttons: [
                    {
                        extend: 'copy',
                        text: 'Copiar',
                        className: 'btn btn-secondary btn-sm mb-2'
                    },
                    {
                        extend: 'excel',
                        text: 'Excel',
                        className: 'btn btn-success btn-sm mb-2'
                    },
                    {
                        extend: 'pdf',
                        text: 'PDF',
                        className: 'btn btn-danger btn-sm mb-2'
                    },
                    {
                        extend: 'print',
                        text: 'Imprimir',
                        className: 'btn btn-info btn-sm mb-2 text-white'
                    }
                ]
            });
            
            // Corrige estilos dos botões do DataTables
            $('.dt-buttons .btn').removeClass('dt-button');
        }

        function openDeleteModal(id, nome) {
            userIdToDelete = id;
            document.getElementById("deleteUserName").textContent = nome;
            const deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));
            deleteModal.show();
        }

        document.getElementById("confirmDeleteBtn").addEventListener("click", async () => {
            if (!userIdToDelete) return;

            const token = localStorage.getItem("token");
            try {
                // ATENÇÃO: Verifique a URL correta de exclusão na sua API
                const response = await fetch(`https://trainingscheduleback-production-2a22.up.railway.app/users/${userIdToDelete}`, {
                    method: "DELETE",
                    headers: { "Authorization": "Bearer " + token }
                });

                if (response.ok) {
                    // Recarrega a tabela e fecha o modal
                    const deleteModal = bootstrap.Modal.getInstance(document.getElementById('deleteModal'));
                    deleteModal.hide();
                    fetchUsers(token);
                } else {
                    alert("Erro ao excluir usuário. A rota pode não existir na API.");
                }
            } catch (error) {
                console.error("Erro:", error);
            }
        });

        checkAuth();
    </script>
</body>
</html>

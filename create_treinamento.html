<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="static/img/favicon-logo.png" type="image/x-icon">
    <title>Incluir Treinamento | Training Schedule</title>

    <script>
        const getPreferredTheme = () => localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', getPreferredTheme());
    </script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background: linear-gradient(135deg, #2c3e50, #34495e); padding: 12px 20px; border-bottom: 2px solid #2ecc71;">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html">
                <img src="static/img/favicon-logo.png" alt="Logo" width="30" height="30" class="d-inline-block align-text-top rounded">
                <span style="letter-spacing: 0.5px;">Training Schedule</span>
            </a>
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavDropdown">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4">
                    <li class="nav-item">
                        <a class="nav-link px-3 text-white" href="index.html" style="font-weight: 500; transition: all 0.3s;">🏠 Início</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle active px-3 text-white" href="#" id="navbarDropdownCadastros" role="button" data-bs-toggle="dropdown" aria-expanded="false" style="font-weight: 500; transition: all 0.3s;">
                            Cadastros
                        </a>
                        <ul class="dropdown-menu shadow border-0 mt-2" aria-labelledby="navbarDropdownCadastros" style="border-radius: 8px;">
                            <li><a class="dropdown-item py-2" href="list_users.html">👥 Usuários</a></li>
                            <li><a class="dropdown-item py-2" href="list_pessoa_tipo.html">🏷️ Tipos de Pessoa</a></li>
                            <li><a class="dropdown-item py-2" href="list_pessoas.html">🧑‍🤝‍🧑 Pessoas</a></li>
                        </ul>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle px-3 text-white" href="#" id="navbarDropdownTreinamentos" role="button" data-bs-toggle="dropdown" aria-expanded="false" style="font-weight: 500; transition: all 0.3s;">
                            Treinamentos
                        </a>
                        <ul class="dropdown-menu shadow border-0 mt-2" aria-labelledby="navbarDropdownTreinamentos" style="border-radius: 8px;">
                            <li><a class="dropdown-item py-2" href="list_treinamento_tipo.html">🏷️ Tipos de Treinamento</a></li>
                            <li><a class="dropdown-item py-2" href="list_treinamentos.html">📚 Agenda de Treinamentos</a></li>
                        </ul>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3 text-white">
                    <button class="btn btn-outline-light btn-sm rounded-circle d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;" id="themeToggleBtn" title="Alternar Tema">
                        <span id="themeIcon">🌓</span>
                    </button>
                    <div class="d-flex align-items-center gap-2" style="background: rgba(255,255,255,0.1); padding: 6px 16px; border-radius: 20px; font-size: 0.95rem;">
                        <span>👤</span>
                        <span id="userName" class="fw-semibold" style="letter-spacing: 0.5px;"></span>
                    </div>
                    <button class="btn btn-outline-light btn-sm px-4 rounded-pill fw-bold" style="transition: all 0.3s;" onclick="logout()" onmouseover="this.classList.replace('btn-outline-light','btn-danger')" onmouseout="this.classList.replace('btn-danger','btn-outline-light')">Sair</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 bg-body">
            <h3 class="fw-bold mb-4">Incluir Treinamento</h3>
            
            <form id="createForm">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control rounded-3" id="descricao" placeholder="Descrição" required>
                    <label for="descricao" class="text-body-secondary">Descrição</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="datetime-local" class="form-control rounded-3" id="datahora_inicio" required>
                    <label for="datahora_inicio" class="text-body-secondary">Data/Hora Início</label>
                </div>

                <div class="form-floating mb-3">
                    <input type="datetime-local" class="form-control rounded-3" id="datahora_fim" required>
                    <label for="datahora_fim" class="text-body-secondary">Data/Hora Fim</label>
                </div>

                <div class="form-floating mb-3">
                    <select class="form-select rounded-3" id="pessoa_id" required>
                        <option value="">Selecione...</option>
                    </select>
                    <label for="pessoa_id" class="text-body-secondary">Pessoa Relacionada</label>
                </div>

                <div class="form-floating mb-3">
                    <select class="form-select rounded-3" id="treinamento_tipo_id" required>
                        <option value="">Selecione...</option>
                    </select>
                    <label for="treinamento_tipo_id" class="text-body-secondary">Tipo de Treinamento</label>
                </div>
                
                <div class="d-flex flex-column flex-md-row gap-3 mt-4">
                    <a href="list_treinamentos.html" class="btn btn-secondary rounded-pill px-4 fw-semibold shadow-sm flex-grow-1 text-center">Cancelar</a>
                    <button type="submit" class="btn btn-success rounded-pill px-4 fw-semibold shadow-sm flex-grow-1">Salvar Treinamento</button>
                </div>
            </form>

            <div id="msgBox" class="mt-4 alert d-none rounded-3" role="alert"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        
        const updateThemeIcon = (theme) => {
            themeIcon.textContent = theme === 'dark' ? '☀️' : '🌙';
        };
        updateThemeIcon(document.documentElement.getAttribute('data-bs-theme'));

        if(themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-bs-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-bs-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                updateThemeIcon(newTheme);
            });
        }
    </script>

    <script>
        async function checkAuth() {
            const token = localStorage.getItem("token");
            if (!token) {
                window.location.href = "login.html";
                return;
            }

            try {
                const response = await fetch("https://training-schedule-back.onrender.com/auth/me", {
                    headers: { "Authorization": "Bearer " + token }
                });

                if (!response.ok) throw new Error();

                const data = await response.json();
                document.getElementById("userName").textContent = data.user.login;

                await loadPessoas(token);
                await loadTiposTreinamento(token);

            } catch (error) {
                logout();
            }
        }

        function logout() {
            localStorage.removeItem("token");
            sessionStorage.removeItem("user");
            window.location.href = "login.html";
        }

        async function loadPessoas(token) {
            try {
                const res = await fetch("https://training-schedule-back.onrender.com/pessoas", {
                    headers: { "Authorization": "Bearer " + token }
                });
                if (res.ok) {
                    const pessoas = await res.json();
                    const select = document.getElementById("pessoa_id");
                    pessoas.forEach(p => {
                        const opt = document.createElement("option");
                        opt.value = p.id;
                        opt.textContent = `${p.nome} (CPF: ${p.cpf})`;
                        select.appendChild(opt);
                    });
                }
            } catch (error) {
                console.error("Erro ao carregar pessoas", error);
            }
        }

        async function loadTiposTreinamento(token) {
            try {
                const res = await fetch("https://training-schedule-back.onrender.com/treinamento-tipo", {
                    headers: { "Authorization": "Bearer " + token }
                });
                if (res.ok) {
                    const tipos = await res.json();
                    const select = document.getElementById("treinamento_tipo_id");
                    tipos.forEach(t => {
                        const opt = document.createElement("option");
                        opt.value = t.id;
                        opt.textContent = t.nome;
                        select.appendChild(opt);
                    });
                }
            } catch (error) {
                console.error("Erro ao carregar tipos de treinamento", error);
            }
        }

        document.getElementById("createForm").addEventListener("submit", async function(e) {
            e.preventDefault();

            const dataInicio = new Date(document.getElementById("datahora_inicio").value);
            const dataFim = new Date(document.getElementById("datahora_fim").value);
            const msgBox = document.getElementById("msgBox");

            if (dataFim <= dataInicio) {
                msgBox.className = "mt-3 alert alert-danger";
                msgBox.textContent = "A Data/Hora Fim deve ser maior que a Data/Hora Início.";
                return;
            }
            
            // Format to mysql format
            const formatForMySQL = (dateObj) => {
                const pad = (n) => n < 10 ? '0' + n : n;
                return dateObj.getFullYear() + '-' +
                    pad(dateObj.getMonth() + 1) + '-' +
                    pad(dateObj.getDate()) + ' ' +
                    pad(dateObj.getHours()) + ':' +
                    pad(dateObj.getMinutes()) + ':00';
            };

            const payload = {
                descricao: document.getElementById("descricao").value,
                datahora_inicio: formatForMySQL(dataInicio),
                datahora_fim: formatForMySQL(dataFim),
                pessoa_id: document.getElementById("pessoa_id").value,
                treinamento_tipo_id: document.getElementById("treinamento_tipo_id").value
            };

            const token = localStorage.getItem("token");
            
            try {
                const response = await fetch("https://training-schedule-back.onrender.com/treinamentos", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    msgBox.className = "mt-3 alert alert-danger";
                    msgBox.textContent = data.error || "Erro ao cadastrar.";
                    return;
                }

                msgBox.className = "mt-3 alert alert-success";
                msgBox.textContent = "Treinamento incluído com sucesso! Redirecionando...";
                
                setTimeout(() => {
                    window.location.href = "list_treinamentos.html";
                }, 1500);
                
            } catch (error) {
                msgBox.className = "mt-3 alert alert-danger";
                msgBox.textContent = "Erro na conexão com a API.";
            }
        });

        checkAuth();
    </script>
</body>
</html>
